# Real values for week 2 (decisions 2.2, 2.3, 2.21). Model IDs are exact - no date suffixes.
generation_model: claude-haiku-4-5    # writes documents, phrases questions
backbone_model: claude-sonnet-5       # extraction, validation checks (Claude route)

# Experiment backbone on Azure (decision 4.1). Deployment names, not secrets;
# endpoint and key come from .env. Version auto-update must stay OFF in Foundry.
azure:
  backbone: gpt-6.1-sol     # Global Standard
  dev: gpt-6-luna           # cheap development runs (not deployed yet)
  models: [gpt-6.1-sol, gpt-6-luna]
  max_output_tokens: 4000   # per call, incl. reasoning - no single call can run away

max_tokens: 16000

# Sonnet 5 only. Haiku 4.5 rejects `effort`. Sonnet 5 rejects `temperature`.
# The gates (closed_book, gold_context) must match the experiment agent's level.
effort:
  kg_extraction: medium
  fidelity_check: medium
  ambiguity_check: medium
  closed_book: high
  gold_context: high
  experiment_agent: high

budget:
  cap_usd: 4.00          # hard stop on logged spend (all providers, USD); raise when more credit is added
  azure_cap_usd: 1.00    # hard stop on logged Azure spend (week-4 limit agreed with the user)
  max_call_usd: 0.05     # any single call above this stops the run

prices_usd_per_mtok:     # Anthropic first-party rates (verified 2026-09-27)
  claude-haiku-4-5: {input: 1.00, output: 5.00}
  claude-sonnet-5: {input: 2.00, output: 10.00}
  gpt-6.1-sol: {input: 2.00, cached_input: 0.10, output: 10.00}   # Azure Global (2026-10-12)
  gpt-6-luna: {input: 0.10, cached_input: 0.01, output: 0.50}
