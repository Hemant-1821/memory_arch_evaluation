# Model IDs are exact - no date suffixes. Week 6 (user, 2026-10-31): everything on the
# Anthropic credits; Azure stays only to replay the week-4/5 Sol runs from the cache.
generation_model: claude-haiku-5-5    # writes documents, phrases questions
backbone_model: claude-sonnet-5-5     # experiment agent, gates, extraction, fidelity + ambiguity checks

# Experiment backbone on Azure (decision 4.1) - no longer called; kept so old runs replay.
# Deployment names, not secrets; endpoint and key come from .env.
azure:
  backbone: gpt-6.1-sol     # Global Standard
  dev: gpt-6-luna           # cheap development runs (not deployed yet)
  max_output_tokens: 4000   # per call, incl. reasoning - no single call can run away

max_tokens: 16000

# Both 5.5 models think adaptively and take `effort` (no `temperature`, thinking can't be
# turned off). The gates (closed_book, gold_context) must match the experiment agent's level.
effort:
  document_writing: medium   # Haiku 5.5 default, set explicitly (ruling 6.3)
  question_phrasing: low     # one short rewrite, guarded by the ambiguity check (ruling 6.3)
  kg_extraction: medium
  fidelity_check: medium
  ambiguity_check: medium
  closed_book: high
  gold_context: high
  experiment_agent: high

budget:
  cap_usd: 15.00         # runaway guard only (user 2026-11-02: the whole $200 credit is available); raised from 8.53 at logged $4.08 (6.11)
  azure_cap_usd: 2.00    # hard stop on logged Azure spend (week-5 limit agreed with the user)
  max_call_usd: 0.05     # any single agent call above this stops the run

prices_usd_per_mtok:     # Anthropic first-party rates; cache_write = 5-minute writes (1.25x input)
  claude-haiku-4-5: {input: 1.00, output: 5.00}
  claude-sonnet-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}   # prompts <= 100K tokens (ours are < 10K)
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  gpt-6.1-sol: {input: 2.00, cached_input: 0.10, output: 10.00}   # Azure Global (2026-10-12)
  gpt-6-luna: {input: 0.10, cached_input: 0.01, output: 0.50}
