# Real values for week 2 (decisions 2.2, 2.3, 2.21). Model IDs are exact - no date suffixes.
generation_model: claude-haiku-4-5    # writes documents, phrases questions
backbone_model: claude-sonnet-5       # extraction, validation checks, experiment agent

max_tokens: 16000

# Sonnet 5 only. Haiku 4.5 rejects `effort`. Sonnet 5 rejects `temperature`.
# The gates (closed_book, gold_context) must match the experiment agent's level.
effort:
  kg_extraction: medium
  fidelity_check: medium
  ambiguity_check: medium
  closed_book: high
  gold_context: high
  experiment_agent: high

budget:
  cap_usd: 2.50          # hard stop on logged spend; raise when more credit is added

prices_usd_per_mtok:     # Anthropic first-party rates (verified 2026-09-27)
  claude-haiku-4-5: {input: 1.00, output: 5.00}
  claude-sonnet-5: {input: 2.00, output: 10.00}
